    <script>
      (function () {
        try {
          var savedTheme = (localStorage.getItem('netpulse-theme') || localStorage.getItem('gg-theme'));
          if (savedTheme === 'dark') document.documentElement.classList.add('dark');
          var savedLang = (localStorage.getItem('netpulse-lang') || localStorage.getItem('gg-lang'));
          if (savedLang) {
            document.documentElement.lang = savedLang;
            document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (e) {}
      })();
    </script>
