      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0b172a"/>
    </linearGradient>
    <linearGradient id="ggGoldPins" x1="20" y1="14" x2="44" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070d1a"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#1e3a5f" stroke-width="1.5"/>
  <!-- RJ45 retention clip -->
  <path d="M23 11H41V16H23V11Z" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5" stroke-linejoin="round"/>
