  <rect x="23.5" y="19" width="2" height="9" rx="0.8" fill="url(#ggGoldPins)"/>
  <rect x="27" y="19" width="2" height="9" rx="0.8" fill="url(#ggGoldPins)"/>
  <rect x="30.5" y="19" width="2" height="9" rx="0.8" fill="url(#ggGoldPins)"/>
  <rect x="34" y="19" width="2" height="9" rx="0.8" fill="url(#ggGoldPins)"/>
  <rect x="37.5" y="19" width="2" height="9" rx="0.8" fill="url(#ggGoldPins)"/>
  <rect x="41" y="19" width="2" height="9" rx="0.8" fill="url(#ggGoldPins)"/>
  <!-- Link LEDs on plug collar -->
  <circle cx="23" cy="36" r="2.2" fill="#22c55e"/>
  <circle cx="41" cy="36" r="2.2" fill="#38bdf8"/>
  <!-- Strain relief boot & Cat6 cable -->
  <path d="M25 44H39L37 52H27L25 44Z" fill="#0f2544" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
